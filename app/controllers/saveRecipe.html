<div class="container mt-5">
  <h2 class="text-center">Choose a Cookbook to Save Your Recipe</h2>
  <div id="cookbookContainer" class="row mt-4">
    <p class="text-center w-100">Loading cookbooks...</p>
  </div>
</div>

<!-- Place your script here, just before the closing </body> tag -->
<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const userId = await getUserId();

    if (!userId) {
      alert("User not logged in!");
      window.location.href = "login.php"; // Redirect to the login page
      return;
    }

    const recipeId = new URLSearchParams(window.location.search).get("recipeId");
    const cookbookContainer = document.getElementById("cookbookContainer");

    // Fetch available cookbooks
    async function fetchCookbooks() {
      try {
        const response = await fetch(`/ChefAI/getCookbooks.php?user_id=${userId}`);
        const cookbooks = await response.json();

        if (cookbooks.error) {
          console.error(cookbooks.error);
          cookbookContainer.innerHTML =
            '<p class="text-center w-100 text-danger">Error loading cookbooks. Please try again later.</p>';
          return;
        }

        if (cookbooks.length > 0) {
          cookbookContainer.innerHTML = ""; // Clear loading message

          cookbooks.forEach((cookbook) => {
            const cookbookCard = document.createElement("div");
            cookbookCard.className = "col-md-4 mb-4";
            cookbookCard.innerHTML = `
              <div class="card">
                <div class="card-body text-center">
                  <h5 class="card-title">${cookbook.name}</h5>
                  <button class="btn btn-success" onclick="saveRecipeToCookbook(${recipeId}, ${cookbook.id})">Save to this Cookbook</button>
                </div>
              </div>
            `;
            cookbookContainer.appendChild(cookbookCard);
          });
        } else {
          cookbookContainer.innerHTML =
            '<p class="text-center w-100">No cookbooks available. Create one to save recipes!</p>';
        }
      } catch (error) {
        console.error("Error fetching cookbooks:", error);
        cookbookContainer.innerHTML =
          '<p class="text-center w-100 text-danger">Error loading cookbooks. Please try again later.</p>';
      }
    }

    // Save recipe to a specific cookbook
    window.saveRecipeToCookbook = async function (recipeId, cookbookId) {
      try {
        console.log("Sending to server:", { recipeId, cookbookId, userId }); // Log the data being sent

        const response = await fetch('/ChefAI/saveRecipe.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ recipeId, cookbookId, userId })
        });

        const data = await response.json();
        console.log("Server Response:", data); // Log the server's response

        if (response.ok) {
          alert("Recipe saved successfully!");
          window.location.href = `cookbook.html?id=${cookbookId}`; // Redirect to the cookbook page
        } else {
          console.error('Error from server:', data.error);
          alert("Error saving recipe. Please try again.");
        }
      } catch (error) {
        console.error("Error saving recipe:", error);
        alert("Error saving recipe. Please try again.");
      }
    }

    // Initialize cookbooks
    fetchCookbooks();
  });

  // Fetch user ID from the server using get_user.php
  async function getUserId() {
    try {
      const response = await fetch('/ChefAI/get_user.php');
      const data = await response.json();
      console.log("Fetched user ID:", data.user_id);  // Log user ID to console
      return data.user_id || null; // Return user_id if found
    } catch (error) {
      console.error("Error fetching user data:", error);
      return null;
    }
  }
</script>
